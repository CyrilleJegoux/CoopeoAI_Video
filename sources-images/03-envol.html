<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="base.css"><script src="lib.js"></script>
<style>
.bg{background:
  radial-gradient(ellipse 900px 700px at 0% 50%,rgba(120,72,24,.55),transparent 70%),
  radial-gradient(ellipse 1300px 900px at 70% 45%,#142a66 0%,#0a1438 45%,#060b1e 80%),#060b1e}
.cell{position:absolute;background:#F2F5F7;border:1px solid #c9d1d8;font-size:30px;padding:12px 18px;color:#1f262d;white-space:nowrap;border-radius:2px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.cell.m{font-family:"JBM";font-size:28px}
.trail{position:absolute;height:6px;border-radius:6px;filter:blur(3px)}
.card{position:absolute;background:rgba(246,248,255,.97);color:#0B1430;border-radius:28px;padding:30px 36px;box-shadow:0 40px 90px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.6)}
.card .k{display:flex;align-items:center;gap:14px;font-weight:700;font-size:28px;color:#26304f}
.card .ic{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.num{font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
</style>
<div class="stage">
  <div class="fill bg"></div>
  <canvas id="c" width="1920" height="1080" class="fill"></canvas>

  <!-- cells (left, warm, flying) -->
  <div class="cell" style="left:40px;top:250px;transform:rotate(-14deg) scale(1.15);filter:blur(2.5px)">Farine T65</div>
  <div class="cell m" style="left:190px;top:470px;transform:rotate(9deg);filter:blur(1.5px)">0,71 €</div>
  <div class="cell" style="left:90px;top:690px;transform:rotate(-6deg) scale(1.3);filter:blur(4px)">Crème 35 %</div>
  <div class="cell m" style="left:420px;top:330px;transform:rotate(18deg) scale(.9);filter:blur(1px);background:#FFF3C4">4,12 €</div>
  <div class="cell" style="left:470px;top:780px;transform:rotate(-20deg) scale(.85);filter:blur(1px)">Beurre doux 82 %</div>
  <div class="cell m" style="left:640px;top:560px;transform:rotate(6deg) scale(.8);border-radius:10px;opacity:.95">25 kg</div>

  <!-- morphing: half cell / half card -->
  <div class="card" style="left:790px;top:250px;padding:18px 24px;border-radius:16px;transform:rotate(-7deg) scale(.82)"><div class="k" style="font-size:24px"><span class="ic" style="background:#0CBF88;width:30px;height:30px;border-radius:8px"></span>Stocks</div></div>

  <!-- main card -->
  <div class="card" style="left:1010px;top:330px;width:700px;transform:perspective(1600px) rotateY(-16deg) rotateX(4deg)">
    <div class="k"><span class="ic" style="background:#F48C03"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2" stroke="#fff" stroke-width="2.6" stroke-linecap="round" fill="none"/></svg></span>Analyse des factures</div>
    <div style="display:flex;gap:56px;margin-top:26px;align-items:flex-end">
      <div><div class="num" style="font-size:96px">5 700 L</div><div style="font-size:26px;color:#4A5578;margin-top:10px">de crème liquide achetés cette année</div></div>
    </div>
    <div style="height:10px;border-radius:10px;background:#E3E8F5;margin-top:26px;overflow:hidden"><div style="width:72%;height:100%;background:linear-gradient(90deg,#F48C03,#FFB54D)"></div></div>
  </div>
  <!-- far cards -->
  <div class="card" style="left:1460px;top:120px;transform:scale(.7);filter:blur(3px);opacity:.85"><div class="k"><span class="ic" style="background:#E01E6D"></span>Fiches techniques</div><div class="num" style="font-size:60px;color:#E01E6D;margin-top:10px">0,37 €</div></div>
  <div class="card" style="left:1480px;top:770px;transform:scale(.62);filter:blur(4px);opacity:.8"><div class="k"><span class="ic" style="background:#129BE0"></span>Ventes</div></div>
  <div class="vignette"></div>
  <script>
    const ctx=document.getElementById('c').getContext('2d');
    ctx.globalCompositeOperation='lighter';
    const cols=['#F48C03','#E01E6D','#0CBF88','#129BE0','#FFB46A'];
    const r=rng(11);
    // light streaks flowing left->right
    for(let i=0;i<46;i++){
      const y=120+r()*860, x0=-100+r()*700, len=300+r()*900, c=cols[i%4], w=1+r()*3.5;
      const g=ctx.createLinearGradient(x0,0,x0+len,0); g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,c);
      ctx.strokeStyle=g; ctx.lineWidth=w; ctx.shadowColor=c; ctx.shadowBlur=14; ctx.globalAlpha=.25+r()*.5;
      ctx.beginPath(); ctx.moveTo(x0,y); ctx.bezierCurveTo(x0+len*.4,y,x0+len*.6,y-(y-540)*.25,x0+len,y-(y-520)*.32); ctx.stroke();
    }
    // particles
    for(let i=0;i<220;i++){ const x=r()*1920,y=r()*1080,s=r()*2.2; ctx.globalAlpha=.25+r()*.6; ctx.fillStyle=x<700?'#FFCF8A':'#9FD8FF'; ctx.shadowBlur=6; ctx.shadowColor=ctx.fillStyle; ctx.beginPath(); ctx.arc(x,y,s,0,7); ctx.fill(); }
  </script>
  <script>document.write(grain(9));</script>
</div>
