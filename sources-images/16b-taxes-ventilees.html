<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="ai.css"><script src="lib.js"></script>
<style>

<div class="stage">
  <div class="fill bgAI"></div>

      <div style="font-size:19px;color:#8FA0C8">Grossiste Viandes ●●●●● · livraison du 25/09/2026</div>
    </div>
    <table class="tbl" id="t"><tr class="h"><td>Produit</td><td class="n">Poids</td><td class="n">P.U. facturé</td><td>Taxe ventilée</td><td class="n">P.U. réel</td><td class="n">Total HT réel</td></tr></table>
  </div>
  <div class="capt" style="left:0;right:0;text-align:center;bottom:64px">Chaque taxe, à sa place.</div>
  <div class="vignette"></div>
  <script>
  const C={b:['#F48C03','Interbev bovins'],c:['#0CBF88','Interbev veau + RSD'],p:['#E01E6D','Inaporc + RSD'],v:['#5C6A92','aucune']};
  const R=[['Suprême de poulet','10,348 kg','7,85','v','—','7,85','81,23'],['Saucisse de Francfort','0,605 kg','7,70','p','0,025','7,725','4,67'],['Entrecôte de bœuf','9,105 kg','22,90','b','0,1197','23,020','209,59'],['Ris de veau','0,825 kg','24,50','c','0,0769','24,577','20,28'],['Onglet de bœuf','5,665 kg','20,50','b','0,1197','20,620','116,81'],['Filet de bœuf','7,245 kg','21,50','b','0,1197','21,620','156,63']];
  const T=document.getElementById('t');
  R.forEach(r=>{const [c,l]=C[r[3]];T.insertAdjacentHTML('beforeend',`<tr><td style="font-weight:700">${r[0]}</td><td class="n" style="color:#C9D6F5">${r[1]}</td><td class="n" style="color:#C9D6F5">${r[2]} €</td><td><span class="tx" style="background:${r[3]==='v'?'rgba(255,255,255,.05)':c+'26'};border:1px solid ${c};color:${r[3]==='v'?'#8FA0C8':'#fff'}">${r[4]==='—'?'—':'+'+r[4]+' €/kg'}</span> <span style="font-size:16px;color:#8FA0C8;margin-left:8px">${l}</span></td><td class="n" style="color:#fff;font-weight:600">${r[5]} €</td><td class="n" style="color:#BFF0FF">${r[6]} €</td></tr>`)});
  const fx=document.getElementById('fx').getContext('2d');const r=rng(82);for(let i=0;i<260;i++){fx.globalAlpha=.35*r();fx.fillStyle='#9FD8FF';fx.beginPath();fx.arc(r()*1920,r()*1080,r()*1.6,0,7);fx.fill();}
  </script>
  <script>document.write(grain(82));</script>
</div>
