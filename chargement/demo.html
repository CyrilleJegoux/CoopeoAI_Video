<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chargement Coopeo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="coopeo-loader.css">
</head>
<body>
  <div class="cl-screen" role="status" aria-live="polite" aria-label="Chargement de votre espace Coopeo">
    <div class="cl-flight" aria-hidden="true">
      <div class="cl-symbol">
        <span class="cl-dot p"></span><span class="cl-dot o"></span><span class="cl-dot g"></span><span class="cl-dot b"></span>
      </div>
    </div>
    <h1 class="cl-title">Bonjour Cyrille</h1>
    <div class="cl-messages">
      <span class="cl-msg">Récupération de vos factures</span>
      <span class="cl-msg">Calcul de vos marges</span>
      <span class="cl-msg">Mise à jour de votre production</span>
      <span class="cl-msg">Préparation de votre tableau de bord</span>
    </div>
    <div class="cl-bar" aria-hidden="true"></div>
    <div class="cl-footer">Coopeo — votre copilote de gestion</div>
  </div>
</body>
</html>
