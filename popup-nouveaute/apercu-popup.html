<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aperçu popup Nouveauté</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:grid;place-items:center;padding:16px;
    background:rgba(15,23,42,.55);font-family:Inter,system-ui,sans-serif}
  .popup{position:relative;display:flex;width:min(720px,100%);background:#fff;border-radius:22px;
    overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.35)}
  /* Panneau vidéo : même ratio que la vidéo (4:5) */
  .media{flex:0 0 270px;aspect-ratio:4/5;background:#070D22}
  .media video{display:block;width:100%;height:100%;object-fit:cover}
  .content{display:flex;flex-direction:column;padding:28px 32px;flex:1}
  .badge{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;
    background:#E6F4FD;color:#0F4C75;font-size:12px;font-weight:700;letter-spacing:.06em}
  .badge::before{content:"";width:7px;height:7px;border-radius:50%;background:#129BE0}
  h2{margin-top:14px;font-family:Fraunces,serif;font-size:24px;line-height:1.2;color:#0f172a}
  p{margin-top:16px;color:#475569;font-size:14px;line-height:1.6}
  .actions{margin-top:auto;padding-top:24px;display:flex;align-items:center;gap:22px}
  .btn{background:#1E4D3A;color:#fff;border:0;border-radius:10px;padding:12px 18px;font-weight:700;font-size:14px}
  .later{background:none;border:0;color:#334155;font-weight:600;font-size:14px}
  .close{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:50%;border:0;background:#EEF2F7;color:#334155}
  @media (max-width:640px){.popup{flex-direction:column}.media{flex:none;width:100%;aspect-ratio:16/10}}
</style>
</head>
<body>
  <div class="popup">
    <div class="media">
      <video autoplay muted playsinline preload="auto" poster="export/coopeo-nouveaute-poster.webp">
        <source src="export/coopeo-nouveaute.webm" type="video/webm">
        <source src="export/coopeo-nouveaute.mp4" type="video/mp4">
      </video>
    </div>
    <div class="content">
      <span class="badge">NOUVEAUTÉ</span>
      <h2>Les taxes viandes,<br>ventilées ligne par ligne</h2>
      <p>Coopeo répartit désormais les taxes Interbev, Inaporc et R.S.D. sur chaque produit concerné. Vos prix au kilo sont exacts, au centime près.</p>
      <div class="actions"><button class="btn">Voir mes achats</button><button class="later">Plus tard</button></div>
    </div>
    <button class="close" aria-label="Fermer">×</button>
  </div>
</body>
</html>
